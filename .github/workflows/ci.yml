name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` below runs
      # `pnpm store path`, so pnpm has to be on PATH first. No `version` here —
      # action-setup reads the pinned `packageManager` (pnpm@11.22.0) from
      # package.json, so CI and local can't float to different pnpm releases.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node comes from .nvmrc (single source of truth with local dev). pnpm 11
      # needs Node >= 22.13 (it uses node:sqlite, absent in Node 20).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The gap this closes: lint + typecheck + unit tests all passed for a
      # deployment that compiled but could not serve a single route in
      # production. A green required check that never builds is not a gate.
      # `next build` is what catches a broken build, a bad next.config, a
      # server/client boundary violation or a prerender failure.
      #
      # NO SECRETS ARE NEEDED. Verified: the build completes and emits all 16
      # routes with a completely empty environment. The one value below is a
      # PLACEHOLDER, not a credential — nothing is contacted at build time. It
      # exists so next.config.ts takes its real branch: `images.remotePatterns`
      # is derived via `new URL(NEXT_PUBLIC_SUPABASE_URL)`, so with the var
      # unset CI would compile the empty-array path that production never uses
      # and a malformed-URL regression there would sail straight through.
      #
      # SENTRY_DSN is deliberately left unset: the config only wraps with
      # withSentryConfig when it is present, and wrapping would attempt
      # source-map upload behaviour that needs a real auth token.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
