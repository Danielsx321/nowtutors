name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` below runs
      # `pnpm store path`, so pnpm has to be on PATH first. No `version` here —
      # action-setup reads the pinned `packageManager` (pnpm@11.22.0) from
      # package.json, so CI and local can't float to different pnpm releases.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node comes from .nvmrc (single source of truth with local dev). pnpm 11
      # needs Node >= 22.13 (it uses node:sqlite, absent in Node 20).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The DOM lane (jsdom + Testing Library). Separate config, disjoint glob,
      # no Postgres and no credentials — unlike `test:db:test`, nothing stops it
      # being a required check. See vitest.dom.config.ts.
      - name: DOM tests
        run: pnpm test:dom

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
